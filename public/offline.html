<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Alumni Association</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --cap-bg: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --card-bg: #111827;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --border: #1f2937;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 440px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: var(--cap-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.25);
    }

    .logo-badge svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fbbf24;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wifi-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      margin-bottom: 16px;
    }

    .wifi-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    p {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-main);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>

    <h1>You're Offline</h1>
    <h2>আপনি অফলাইনে আছেন</h2>

    <p>
      Please check your network connection and try again. Previously cached pages and resources remain accessible.
      <br><br>
      ইন্টারনেট সংযোগ চেক করে পুনরায় চেষ্টা করুন।
    </p>

    <div class="btn-group">
      <button class="btn-primary" onclick="handleRetry()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
        </svg>
        <span>Try Again / পুনরায় চেষ্টা করুন</span>
      </button>

      <button class="btn-secondary" onclick="window.history.back()">
        <span>Go Back / ফিরে যান</span>
      </button>
    </div>
  </div>

  <script>
    function handleRetry() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.btn-primary span');
        const orig = btn.textContent;
        btn.textContent = 'Still Offline...';
        setTimeout(() => {
          btn.textContent = orig;
        }, 1500);
      }
    }

    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
